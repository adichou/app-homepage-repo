<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="tf-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--diag-accent, #1769e0)"/>
    </marker>
    <marker id="tf-ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="var(--diag-muted, #a8a29e)"/>
    </marker>
    <linearGradient id="tf-lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a90f2"/>
      <stop offset="1" stop-color="#1667d9"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="0" y="0" width="1200" height="640" rx="18" fill="var(--diag-bg, #faf9f7)"/>
  <rect x="0.5" y="0.5" width="1199" height="639" rx="18" fill="none" stroke="var(--diag-line, #e7e5e4)"/>

  <!-- ═══ 拓扑区：手机经拓展坞连接源盘与目标盘 ═══ -->

  <!-- iPhone（CamMan 助手） -->
  <g transform="translate(60,110)">
    <rect x="0" y="0" width="110" height="200" rx="24" fill="var(--diag-card, #ffffff)" stroke="var(--diag-stroke, #44403c)" stroke-width="2.5"/>
    <rect x="39" y="11" width="32" height="7" rx="3.5" fill="var(--diag-stroke, #44403c)"/>
    <rect x="10" y="30" width="90" height="140" rx="8" fill="var(--diag-screen, #f0f6ff)" stroke="var(--diag-screen-line, #dbe7f8)"/>
    <!-- App logo -->
    <g transform="translate(27,40)">
      <rect x="0" y="0" width="56" height="56" rx="13" fill="url(#tf-lg)"/>
      <path d="M33 4 H49 V24 L43 30 H33 Z" fill="#33507e"/>
      <line x1="37" y1="8" x2="37" y2="15" stroke="#e8b64c" stroke-width="2" stroke-linecap="round"/>
      <line x1="41" y1="8" x2="41" y2="15" stroke="#e8b64c" stroke-width="2" stroke-linecap="round"/>
      <line x1="45" y1="8" x2="45" y2="15" stroke="#e8b64c" stroke-width="2" stroke-linecap="round"/>
      <rect x="16" y="13" width="14" height="7" rx="2" fill="#ffffff"/>
      <rect x="8" y="18" width="40" height="26" rx="6" fill="#ffffff"/>
      <circle cx="14" cy="24" r="2.5" fill="#f59e0b"/>
      <circle cx="28" cy="31" r="9" fill="#1769e0"/>
      <circle cx="28" cy="31" r="6" fill="#ffffff"/>
      <circle cx="28" cy="31" r="3.5" fill="#7db4f5"/>
      <rect x="10" y="47" width="36" height="6" rx="3" fill="#ffffff" opacity="0.45"/>
    </g>
    <text x="55" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="var(--diag-text, #1c1917)">CamMan 助手 App</text>
    <!-- 相片缩略图 -->
    <rect x="18" y="124" width="18" height="16" rx="3" fill="var(--diag-thumb, #c7dbf7)"/>
    <rect x="41" y="124" width="18" height="16" rx="3" fill="var(--diag-thumb, #c7dbf7)"/>
    <rect x="64" y="124" width="18" height="16" rx="3" fill="var(--diag-accent, #1769e0)"/>
    <rect x="18" y="144" width="18" height="16" rx="3" fill="var(--diag-thumb, #c7dbf7)"/>
    <rect x="41" y="144" width="18" height="16" rx="3" fill="var(--diag-thumb, #c7dbf7)"/>
    <rect x="64" y="144" width="18" height="16" rx="3" fill="var(--diag-thumb, #c7dbf7)"/>
    <rect x="37" y="176" width="36" height="5" rx="2.5" fill="var(--diag-stroke, #44403c)"/>
  </g>
  <text x="115" y="342" text-anchor="middle" font-size="17" font-weight="700" fill="var(--diag-text, #1c1917)" font-family="Georgia, 'Songti SC', serif">手机</text>

  <!-- USB-C 连接线 -->
  <line x1="170" y1="210" x2="324" y2="210" stroke="var(--diag-muted, #a8a29e)" stroke-width="2" marker-end="url(#tf-ahg)"/>
  <text x="247" y="200" text-anchor="middle" font-size="11" fill="var(--diag-subtle, #78716c)">USB-C</text>

  <!-- 拓展坞 -->
  <g transform="translate(330,180)">
    <rect x="0" y="0" width="140" height="60" rx="10" fill="var(--diag-card, #ffffff)" stroke="var(--diag-stroke, #44403c)" stroke-width="2.5"/>
    <circle cx="132" cy="15" r="4" fill="var(--diag-accent, #1769e0)"/>
    <circle cx="132" cy="30" r="4" fill="var(--diag-accent, #1769e0)"/>
    <circle cx="132" cy="45" r="4" fill="var(--diag-accent, #1769e0)"/>
    <rect x="16" y="20" width="24" height="12" rx="3" fill="var(--diag-bg, #faf9f7)" stroke="var(--diag-muted, #a8a29e)" stroke-width="1.5"/>
  </g>
  <text x="400" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="var(--diag-text, #1c1917)" font-family="Georgia, 'Songti SC', serif">拓展坞</text>

  <!-- 拓展坞 → 外置硬盘（目标盘） -->
  <line x1="470" y1="195" x2="884" y2="195" stroke="var(--diag-muted, #a8a29e)" stroke-width="2" marker-end="url(#tf-ahg)"/>
  <!-- 拓展坞 → 读卡器（源盘） -->
  <polyline points="470,225 545,225 545,340 634,340" fill="none" stroke="var(--diag-muted, #a8a29e)" stroke-width="2" marker-end="url(#tf-ahg)"/>

  <!-- 外置硬盘（目标盘） -->
  <g transform="translate(890,150)">
    <rect x="0" y="0" width="160" height="90" rx="12" fill="var(--diag-card, #ffffff)" stroke="var(--diag-stroke, #44403c)" stroke-width="2.5"/>
    <circle cx="134" cy="22" r="5" fill="var(--diag-accent, #1769e0)"/>
    <line x1="16" y1="62" x2="144" y2="62" stroke="var(--diag-muted, #a8a29e)" stroke-width="2" stroke-linecap="round"/>
    <line x1="16" y1="72" x2="110" y2="72" stroke="var(--diag-muted, #a8a29e)" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="975" y="120" width="76" height="28" rx="14" fill="var(--diag-accent, #1769e0)"/>
    <text x="1013" y="139" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--diag-on-accent, #ffffff)">目标盘</text>
  </g>
  <text x="970" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="var(--diag-text, #1c1917)" font-family="Georgia, 'Songti SC', serif">外置硬盘</text>

  <!-- 读卡器 + 相机卡（源盘） -->
  <g transform="translate(640,250)">
    <path d="M28 0 H122 L152 30 V48 H0 V0 Z" fill="var(--diag-card, #ffffff)" stroke="var(--diag-stroke, #44403c)" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="14" y="20" width="60" height="18" rx="3" fill="var(--diag-accent-soft, #e8f0fd)" stroke="var(--diag-accent, #1769e0)" stroke-width="1.5"/>
    <rect x="0" y="48" width="170" height="84" rx="12" fill="var(--diag-card, #ffffff)" stroke="var(--diag-stroke, #44403c)" stroke-width="2.5"/>
    <circle cx="146" cy="66" r="5" fill="var(--diag-accent, #1769e0)"/>
    <line x1="16" y1="106" x2="130" y2="106" stroke="var(--diag-muted, #a8a29e)" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="815" y="272" width="62" height="28" rx="14" fill="var(--diag-accent, #1769e0)"/>
    <text x="846" y="291" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--diag-on-accent, #ffffff)">源盘</text>
  </g>
  <text x="725" y="412" text-anchor="middle" font-size="17" font-weight="700" fill="var(--diag-text, #1c1917)" font-family="Georgia, 'Songti SC', serif">读卡器 + 相机卡</text>

  <!-- 数据流：源盘 → 目标盘 -->
  <path d="M814 340 C872 336 880 292 897 247" fill="none" stroke="var(--diag-accent, #1769e0)" stroke-width="3.5" marker-end="url(#tf-ah)"/>

  <!-- ═══ 三步流程 ═══ -->
  <g>
    <rect x="90" y="455" width="320" height="130" rx="14" fill="var(--diag-card, #ffffff)" stroke="var(--diag-line, #e7e5e4)" stroke-width="1.5"/>
    <circle cx="142" cy="520" r="22" fill="var(--diag-accent, #1769e0)"/>
    <text x="142" y="528" text-anchor="middle" font-size="20" font-weight="700" fill="var(--diag-on-accent, #ffffff)">1</text>
    <text x="180" y="507" font-size="17" font-weight="700" fill="var(--diag-text, #1c1917)" font-family="Georgia, 'Songti SC', serif">复制文件</text>
    <text x="180" y="537" font-size="13.5" fill="var(--diag-subtle, #78716c)">复制到隐藏暂存区并计算 SHA-256</text>
  </g>
  <line x1="416" y1="520" x2="434" y2="520" stroke="var(--diag-muted, #a8a29e)" stroke-width="2" marker-end="url(#tf-ahg)"/>
  <g>
    <rect x="440" y="455" width="320" height="130" rx="14" fill="var(--diag-card, #ffffff)" stroke="var(--diag-line, #e7e5e4)" stroke-width="1.5"/>
    <circle cx="492" cy="520" r="22" fill="var(--diag-accent, #1769e0)"/>
    <text x="492" y="528" text-anchor="middle" font-size="20" font-weight="700" fill="var(--diag-on-accent, #ffffff)">2</text>
    <text x="530" y="507" font-size="17" font-weight="700" fill="var(--diag-text, #1c1917)" font-family="Georgia, 'Songti SC', serif">核对副本</text>
    <text x="530" y="537" font-size="13.5" fill="var(--diag-subtle, #78716c)">SHA-256 与 JPEG 完整性校验</text>
  </g>
  <line x1="766" y1="520" x2="784" y2="520" stroke="var(--diag-muted, #a8a29e)" stroke-width="2" marker-end="url(#tf-ahg)"/>
  <g>
    <rect x="790" y="455" width="320" height="130" rx="14" fill="var(--diag-card, #ffffff)" stroke="var(--diag-line, #e7e5e4)" stroke-width="1.5"/>
    <circle cx="842" cy="520" r="22" fill="var(--diag-accent, #1769e0)"/>
    <text x="842" y="528" text-anchor="middle" font-size="20" font-weight="700" fill="var(--diag-on-accent, #ffffff)">3</text>
    <text x="880" y="507" font-size="17" font-weight="700" fill="var(--diag-text, #1c1917)" font-family="Georgia, 'Songti SC', serif">删除原件</text>
    <text x="880" y="537" font-size="13.5" fill="var(--diag-subtle, #78716c)">副本核对通过才删除源文件</text>
  </g>

  <!-- 底注 -->
  <text x="600" y="618" text-anchor="middle" font-size="14" fill="var(--diag-subtle, #78716c)">数据仅在手机与外置存储之间流转，全程不经过云端</text>
</svg>
